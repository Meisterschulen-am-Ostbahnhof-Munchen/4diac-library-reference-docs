<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1650.625 132.0"
     width="1650.625" height="132.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt"), url("../../../_static/fonts/TGL-0-17_std.ttf") format("truetype");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16"), url("../../../_static/fonts/TGL-0-16_std.ttf") format("truetype");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(763.5625, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 145.9375 0
            A 3 3 0 0 1 148.9375 3
            L 148.9375 23.0
            A 3 3 0 0 1 145.9375 26.0
            L 138.9375 26.0
            L 138.9375 66.0
            L 145.9375 66.0
            A 3 3 0 0 1 148.9375 69.0
            L 148.9375 109.0
            A 3 3 0 0 1 145.9375 112.0
            L 3 112.0
            A 3 3 0 0 1 0 109.0
            L 0 69.0
            A 3 3 0 0 1 3 66.0
            L 10 66.0
            L 10 26.0
            L 3 26.0
            A 3 3 0 0 1 0 23.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
          fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1.5"
          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="1.5,11.0 6.5,16.0 1.5,21.0" fill="#63B31F"/>
    <text x="9.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">PROCESSED</text>

    <polygon points="142.4375,11.0 147.4375,16.0 142.4375,21.0" fill="#63B31F"/>
    <text x="139.4375" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">DATA</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 29.21875 37.0
            L 45.21875 37.0
            A 1 1 0 0 1 46.21875 38.0
            L 46.21875 41.5
            L 44.21875 41.5
            L 44.21875 44.5
            L 46.21875 44.5
            L 46.21875 54.0
            A 1 1 0 0 1 45.21875 55.0
            L 29.21875 55.0
            A 1 1 0 0 1 28.21875 54.0
            L 28.21875 44.5
            L 30.21875 44.5
            L 30.21875 41.5
            L 28.21875 41.5
            L 28.21875 38.0
            A 1 1 0 0 1 29.21875 37.0
            Z"
          fill="#87CEEB" stroke="#1565C0" stroke-width="1"/>
    <text x="37.21875" y="51.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12" font-weight="bold"
          fill="#000000" text-anchor="middle">S</text>

    <!-- Block Name -->
    <text x="51.21875" y="51.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" font-style="italic">AFIFO_UINT</text>
    
    <text x="74.46875" y="66.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12"
          fill="#666666" text-anchor="middle">1.1</text>

    <!-- Data Ports -->

    <polygon points="142.4375,71.0 147.4375,76.0 142.4375,81.0" fill="#18519E"/>
    <text x="139.4375" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">OUT</text>

    <polygon points="142.4375,91.0 147.4375,96.0 142.4375,101.0" fill="#18519E"/>
    <text x="139.4375" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">N</text>


    <!-- Event-Data Association Connectors and Lines -->

    <rect x="153.9375" y="11.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="153.9375" y="71.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="158.9375" y1="16.0" x2="158.9375" y2="76.0"
          stroke="#000000" stroke-width="1"/>

    <rect x="153.9375" y="91.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="158.9375" y1="16.0" x2="158.9375" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <!-- Horizontal Connection Lines -->

    <line x1="148.9375" y1="16.0" x2="168.9375" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="148.9375" y1="76.0" x2="168.9375" y2="76.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="148.9375" y1="96.0" x2="168.9375" y2="96.0"
          stroke="#000000" stroke-width="1"/>

    <!-- External Labels -->

    <text x="-25" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Konsument (SOCKET) bestaetigt: OUT ist verarbeitet, der naechste Wert (falls vorhanden) kann geliefert werden – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="173.9375" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – PLUG (FIFO) liefert einen neuen Wert - es folgt kein weiteres DATA, bevor nicht PROCESSED eingetroffen ist</text>

    <text x="173.9375" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">UINT</tspan> – Gelieferter Wert, gueltig bis zur naechsten PROCESSED-Bestaetigung</text>

    <text x="173.9375" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">UINT</tspan> – Anzahl der danach noch wartenden Elemente in der Queue</text>
  </g>
</svg>