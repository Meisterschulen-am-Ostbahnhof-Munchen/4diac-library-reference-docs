    <text x="-25" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Object ID Softkey Ein/Aus (Toggle), traegt auch die Hintergrundfarbe – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">UINT</tspan></text>

    <text x="-25" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Object ID AuxFunction2 (Joystick) fuer den Toggle - gleichberechtigt zum SoftKey, zeigt Hintergrundfarbe am Aux-Handle mit – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">UINT</tspan></text>

    <text x="-25" y="117.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Object ID IO-Diag-Testbutton (Ausgaenge-Diagnoseseite) - toggelt gleichberechtigt mit, zeigt Hintergrundfarbe gemeinsam mit SoftKey+AUX – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">UINT</tspan></text>

    <text x="-25" y="137.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Object ID Softkey 'Alles Aus' (Reset, hart auf AUS) - z.B. SoftKey_AUS – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">UINT</tspan></text>

    <text x="-25" y="157.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
