    <text x="-25" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Reset hart auf AUS, von aussen als Event (z.B. 1 zentral gelesener gemeinsamer SoftKey) - zusaetzlich zum eigenen u16ObjId_RESET/u16ObjIdA_RESET/ID_RESET_METHOD-Pfad. Unverdrahtet lassen, wenn nicht gebraucht. – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="258.9375" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
