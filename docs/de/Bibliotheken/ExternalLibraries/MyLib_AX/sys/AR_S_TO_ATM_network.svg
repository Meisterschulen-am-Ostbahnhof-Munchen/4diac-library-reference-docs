TIME-Sockets (z.B. FT_PT1_AR.TM), die von einer per VT/Web einstellbaren, in
Sekunden editierten REAL-Groesse (AR2) gespeist werden sollen. T#1s * Sekunden
(adapter::iec61131::arithmetic::AR_MULTIME) - echte IEC-61131-3-TIME-Arithmetik,
analog dem bereits bestehenden Sec_To_Time in INI_OPC_PARAM_ATM.SUB.</text>
