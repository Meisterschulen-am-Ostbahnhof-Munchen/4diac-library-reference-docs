    <!-- External Labels -->

    <text x="-25" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Schaltet die Automatik hart EIN (z.B. von einer anderen, uebergeordneten Automatik oder einem Methodenaufruf). Unverdrahtet lassen, wenn nicht gebraucht. – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="-25" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Schaltet die Automatik hart AUS (z.B. von einem Kollisionsschutz-Methodenaufruf). Unverdrahtet lassen, wenn nicht gebraucht. – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="-25" y="57.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Reset hart auf Hand/AUS, von aussen als Event (z.B. 1 zentral gelesener gemeinsamer SoftKey) - zusaetzlich zum eigenen u16ObjId_RESET/u16ObjIdA_RESET/ID_RESET_METHOD-Pfad. Unverdrahtet lassen, wenn nicht gebraucht. – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="407.75" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Feuert nur beim Klick (Button/Softkey/Aux, PERMIT-gefiltert), der die Automatik von AUS auf EIN schaltet (per E_SWITCH auf dem Q-Zustand VOR dem Klick gefiltert - ein Klick der AUS schaltet feuert das NICHT). Echter Display-Klick-Event, kein Zustands-Level/Republish.</text>

    <text x="-25" y="117.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Object ID VT-Softkey (Automatik/Hand-Umschalter) – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">UINT</tspan></text>

    <text x="-25" y="137.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Object ID AuxFunction2 (Joystick), gleichberechtigt zum VT-Button - optional, ID_NULL wenn kein AUX gebraucht wird – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">UINT</tspan></text>

    <text x="-25" y="157.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Object ID VT-Button (Automatik/Hand-Umschalter) – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">UINT</tspan></text>

    <text x="-25" y="177.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Automatik-Zustand beim Start – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">BOOL</tspan></text>

    <text x="-25" y="197.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Lokale Publish-Adresse (BOOL, ACTION=WRITE) fuer den Automatik-Ein/Aus-Zustand - Status-Text auf der VT + Web-Client/Dashboard – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">WSTRING</tspan></text>

    <text x="-25" y="217.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Object ID Softkey 'Alles Aus' (Reset, hart auf Hand/AUS) - z.B. SoftKey_AUS – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">UINT</tspan></text>

    <text x="-25" y="237.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Object ID AuxFunction2 (Joystick) fuer den Reset - gleichberechtigt zum Softkey 'Alles Aus' – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">UINT</tspan></text>

    <text x="-25" y="257.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Lokale Methodenadresse (ACTION=CREATE_METHOD) fuer den argumentlosen Reset-Trigger (hart auf Hand/AUS) - wird von Web-Client UND OPC-Dashboard aufgerufen – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">WSTRING</tspan></text>

    <text x="-25" y="283.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">AX</tspan></text>

    <text x="407.75" y="283.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">AX</tspan> – Automatik aktiv (roh, z.B. fuer eine Freigabe-UND-Verknuepfung)</text>

    <text x="407.75" y="303.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">AX</tspan> – NICHT Automatik aktiv (fuer PID-Regler MAN-Eingang)</text>
