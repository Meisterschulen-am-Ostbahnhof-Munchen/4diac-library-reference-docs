    <text x="407.75" y="323.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">AX</tspan> – Automatik aktiv (roh, z.B. fuer eine Freigabe-UND-Verknuepfung)</text>

    <text x="407.75" y="343.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
