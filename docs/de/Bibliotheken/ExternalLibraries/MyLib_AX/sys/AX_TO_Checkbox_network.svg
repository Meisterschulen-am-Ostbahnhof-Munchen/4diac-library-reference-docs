  <text x="-97.8" y="-127.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">Gegenstueck zu Checkbox_IDA_TO_AX: AX (Pegel) auf eine VT-Checkbox
schreiben (AX_TO_AD + F_DWORD_TO_UDINT + isobus::UT::Q::Q_NumericValue),
schreibt bei jeder Wertaenderung von AX_IN neu auf den VT-Knoten.
WICHTIG: u16ObjId ist die ObjectID der CNumberVariable, die die Checkbox als
Wertspeicher referenziert (z.B. NumberVariable_Bunker_Fuellstand_Hoehe_Automatik)
- NICHT die ObjectID der Checkbox (CInputBoolean) selbst, die VT erwartet
Value-Aenderungen unter der NumberVariable-ID (analog Checkbox_IDA_TO_AX,
Franz, live verifiziert). Instanz-Eindeutigkeit beachten: Q_NumericValue
erlaubt nur eine Instanz je Ziel-ObjId im gesamten Projekt.</text>
