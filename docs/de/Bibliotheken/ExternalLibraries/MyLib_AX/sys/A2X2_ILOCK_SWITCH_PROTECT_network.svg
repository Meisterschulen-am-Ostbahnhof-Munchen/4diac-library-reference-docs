  <text x="-36.0" y="-127.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">Buendelt den NET-Roundtrip (bidirektionales A2X2) mit der Last-Wins-Arbitrierung samt Schutz-Totzeit: A2X2_TO_A2X spaltet A2X2 in ein unidirektionales A2X-Socket (Taster-Zustand) + -Plug (Rueckschreibe-Zustand), ILOCK_SWITCH_PROTECT_A2X arbeitet direkt auf dem gebuendelten Paar, A2X_SPLIT_2 dupliziert den interlocked Zustand auf den Rueckschreibe-Pfad und auf den externen A2X-Plug (fuer die physischen Ausgaenge) - 'SUB style': Bridge+Interlock+Split stecken im Composite, nicht in der Resource des Geraets.</text>
