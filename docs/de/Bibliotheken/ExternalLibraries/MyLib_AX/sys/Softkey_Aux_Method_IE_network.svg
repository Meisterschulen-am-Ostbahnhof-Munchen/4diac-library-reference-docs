OPC-UA-Methode (ACTION=CREATE_METHOD, SERVER_0 - z.B. von
Web-Client/vt-ui-mirror oder OPC-Dashboard aufgerufen) aktiviert -&gt; 1
gemeinsames IND-Event. Baut auf Softkey_Aux_IE auf und ergaenzt den
Methoden-Kanal - Gegenstueck zu Softkey_Aux_Web_IE (dort: Web per
SUBSCRIBE_R_TRIG auf eine geschriebene Variable, hier: Web/Dashboard per echtem
RPC-Methodenaufruf, keine gemeinsame Variable).</text>
