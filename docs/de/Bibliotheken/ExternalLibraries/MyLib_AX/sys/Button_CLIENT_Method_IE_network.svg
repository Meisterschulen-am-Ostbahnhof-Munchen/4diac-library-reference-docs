  <text x="-15.4" y="-127.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">VT-Button (Button_IE) loest per CLIENT_0 einen entfernten argument- und
rueckgabewertlosen OPC-UA-Methodenaufruf (ACTION=CALL_METHOD) aus - allgemeines
Muster fuer 'VT-Taste ruft eine Methode auf einer anderen Station auf',
herausgeloest aus logiBUS_AI_Calibrated_Subscribe_VT_OPC (CO/CS kamen dort 2x
identisch vor, siehe OPC_UA_VERNETZUNG.md Punkt 14). Analog zu Button_Method_IE
(dort: Button ODER lokale Methode -&gt; gemeinsames IND), hier aber der umgekehrte
'Caller'-Fall: Button -&gt; entfernte Methode.</text>
