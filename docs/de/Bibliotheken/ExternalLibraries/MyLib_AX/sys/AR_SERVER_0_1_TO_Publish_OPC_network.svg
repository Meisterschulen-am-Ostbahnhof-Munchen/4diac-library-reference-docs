(CALL_METHOD, AR_SERVER_0_1) und publiziert ihn sofort lokal weiter
(AR_PUBLISH_1) - kein VT-Anschluss, reine Weiterleitungsbruecke fuer Stationen
ohne VT. Fuer 'VT-Eingabefeld auf einer anderen Station ODER Web-Dashboard rufen
dieselbe Methode auf, nur bei echter Eingabe' (Franz), z.B. Druck-Referenzwerte
(B20).</text>
