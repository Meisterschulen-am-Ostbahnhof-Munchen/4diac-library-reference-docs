    <text x="147.75" y="157.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">N</text>

    <polygon points="150.75,171.0 155.75,176.0 150.75,181.0" fill="#A3B08F"/>
    <text x="147.75" y="177.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
