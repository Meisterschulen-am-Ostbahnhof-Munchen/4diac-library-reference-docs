          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="190.25" y="151.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="195.25" y1="56.0" x2="195.25" y2="156.0"
          stroke="#000000" stroke-width="1"/>

