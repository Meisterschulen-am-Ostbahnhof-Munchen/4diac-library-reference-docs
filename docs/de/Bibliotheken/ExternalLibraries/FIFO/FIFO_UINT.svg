    <text x="9.5" y="177.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">IN</text>

    <polygon points="150.75,131.0 155.75,136.0 150.75,141.0" fill="#A3B08F"/>
