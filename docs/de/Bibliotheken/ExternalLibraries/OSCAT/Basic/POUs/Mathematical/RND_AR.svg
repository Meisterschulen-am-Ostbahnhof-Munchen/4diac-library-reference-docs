    <line x1="0" y1="16.0" x2="-20" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="0" y1="76.0" x2="-20" y2="76.0"
          stroke="#000000" stroke-width="1"/>

    <!-- External Labels -->

    <text x="-25" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Explizite Ausfuehrungsanforderung (durchgereicht an RND.REQ, zusaetzlich zu AR_IN.E1) – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan></text>

    <text x="-25" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Signifikante Stellen gesamt, nicht Nachkommastellen (durchgereicht an RND.N) - Platzhalter-Default 3, keine funktionale Vorgabe, per Parameter ueberschreibbar – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">INT</tspan></text>

    <text x="-25" y="103.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">Eingangssignal (REAL) – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">AR</tspan></text>

    <text x="154.125" y="103.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">AR</tspan> – Auf N signifikante Stellen gerundeter Wert (REAL)</text>
  </g>
