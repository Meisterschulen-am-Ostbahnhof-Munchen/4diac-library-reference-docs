    <polygon points="1.5,11.0 6.5,16.0 1.5,21.0" fill="#63B31F"/>
    <text x="9.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">REQ</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 30.375 37.0
            L 46.375 37.0
            A 1 1 0 0 1 47.375 38.0
            L 47.375 41.5
            L 45.375 41.5
            L 45.375 44.5
            L 47.375 44.5
            L 47.375 54.0
            A 1 1 0 0 1 46.375 55.0
            L 30.375 55.0
            A 1 1 0 0 1 29.375 54.0
            L 29.375 44.5
