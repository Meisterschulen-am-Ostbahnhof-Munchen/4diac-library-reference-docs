            L 120.125 98.66666666666667
            L 122.625 98.66666666666667
            L 122.625 97.0
            L 127.625 97.0
            L 127.625 107.0
            L 122.625 107.0
            L 122.625 105.33333333333333
            L 120.125 105.33333333333333
