    <text x="-25" y="97.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">MUL input 2 – <tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">ANY_NUM</tspan></text>

    <text x="-25" y="117.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
