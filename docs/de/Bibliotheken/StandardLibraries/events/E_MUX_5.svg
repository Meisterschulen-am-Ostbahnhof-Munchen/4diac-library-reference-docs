    <text x="142.375" y="157.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">UINT</tspan> – Event index</text>
