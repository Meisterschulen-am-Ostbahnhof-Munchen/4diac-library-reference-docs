(isobus::UT::io::NumericValue::NumericValue_IDA + AD_TO_AX), reiner
Ein/Aus-Zustand ohne Skalierung/Persistenz, z.B. fuer Automatik_Toggle.PERMIT.
WICHTIG: u16ObjId ist die ObjectID der CNumberVariable, die die Checkbox als
Wertspeicher referenziert (z.B.
NumberVariable_Bunker_Fuellstand_Hoehe_Automatik) - NICHT die ObjectID der
Checkbox (CInputBoolean) selbst, die VT meldet Value-Aenderungen unter der
NumberVariable-ID (Franz, live verifiziert).</text>
