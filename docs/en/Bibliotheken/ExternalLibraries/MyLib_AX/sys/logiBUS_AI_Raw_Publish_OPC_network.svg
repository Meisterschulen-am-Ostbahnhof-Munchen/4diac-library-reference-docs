  <text x="-248.9" y="-127.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">logiBUS_AI_IDA (Analog-Eingang) rein Rohwert lesen + per OPC-UA publizieren
(DWORD 0-4095), OHNE jegliche VT-Interaktion. Fuer Sensoren, deren physischer
Analog-Eingang auf einer Station OHNE VT-Anschluss sitzt (z.B.
Hangausgleich-Winkelsensor B14 auf APIXON STG3) - die Kalibrierung +
VT-Taster/-Anzeigen laufen dann auf der Station mit VT-Anschluss, gespeist per
Remote-Subscribe dieses Rohwerts (siehe logiBUS_AI_Calibrate_3P_Remote_IDA_OPC).</text>
