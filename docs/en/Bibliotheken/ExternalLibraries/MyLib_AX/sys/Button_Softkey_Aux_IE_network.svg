  <text x="-10.1" y="-127.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">Button (nicht-latching) ODER SoftKey ODER AUX-Zuweisung (Joystick) aktiviert -&gt;
1 gemeinsames IND-Event (BT_RELEASED_UNLATCHED bzw. SK_RELEASED bzw. AuxEnabled
fest verdrahtet). Analog Button_Aux_IE/Softkey_Aux_IE, aber alle drei Quellen
gleichzeitig - Softkey_IE und Button_IE sind zwei getrennte
FORTE-Service-Interface-Bausteine fuer unterschiedliche VT-Activation-Messages,
ein Button liefert NIE ein SK_PRESSED (Franz, 2026-09-20, hat Softkey_IE selbst
implementiert: 'tut sie NICHT'). Der Button MUSS non-latching sein (Latchable=0
im Pool) - ein latching Button kann nur sinnvoll ueber Button_IXA
(Dauerzustand/Pegel) gelesen werden, nicht ueber dieses Event-InputEvent-Muster
(Franz, 2026-09-20).</text>
