  <text x="-90.8" y="-127.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">2 Remote-Kommandos (Heben/Senken, je Subscribe+State-Publish, ODER-verknuepft mit IO-Test wie bei ILOCK_SWITCH_2_QXA_OPC) auf 1 ratiometrisches PWM-Signal (Danfoss PVEA: 25%=Senken, 50%=Neutral, 75%=Heben, Lastteiler-korrigiert) + 1 Freigabe-DO als Klick-Toggle (AX_T_FF_INIT, Default AN, per RPC-Methode aus VT und Dashboard aus-/einschaltbar - Not-Bedienung, z.B. Strassenmodus). Generisch fuer jeden PVEA-Aktor mit 2 physischen Kanaelen (links=PWM, rechts=Freigabe), Bedienung von einem Modul ohne eigenes VT.</text>
