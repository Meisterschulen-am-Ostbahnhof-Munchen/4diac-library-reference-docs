  <text x="-33.6" y="-127.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">SoftKey (VT) ODER lokaler Web-Override (vt-ui-mirror, Dauerzustand) zu 1
gemeinsamem kontinuierlichem AX-Zustand zusammengefuehrt - fuer Taster ohne
AUX-Zuordnung (z.B. Fahrwerk-Mittelpunkt), die trotzdem per Web-Client genauso
wie physisch gedrueckt/gehalten werden koennen sollen. Analog zu
Softkey_Aux_IXA_TO_Remote_WRITE (dort zusaetzlich mit AUX + Remote-Write), hier
nur der reine Merge ohne AUX und ohne Schreiben irgendwohin - der Aufrufer
verarbeitet den gemergten Zustand selbst weiter (z.B. SoftKey_Kurz_Lang).</text>
