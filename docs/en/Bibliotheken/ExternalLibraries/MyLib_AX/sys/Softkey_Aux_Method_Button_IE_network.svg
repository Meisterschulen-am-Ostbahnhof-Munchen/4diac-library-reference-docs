  <text x="-20.4" y="-127.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">Softkey_Aux_Method_IE (SoftKey ODER AUX ODER lokale OPC-UA-Methode) ODER
zusaetzlich ein weiterer Button (Button_IE, eigener CButton - z.B.
IO-Diag-Testbutton, kann aber auch ein regulaerer Button sein) aktiviert -&gt; 1
gemeinsames IND-Event. Fuer Ausgaenge, die sowohl echt bedient
(SoftKey/AUX/Web/Dashboard) als auch per zusaetzlichem Button gleichberechtigt
getriggert werden sollen - Background des Buttons wird vom Aufrufer separat aus
dem resultierenden Zustand gespeist (dafuer bleibt u16ObjIdB beim Aufrufer
verfuegbar).</text>
