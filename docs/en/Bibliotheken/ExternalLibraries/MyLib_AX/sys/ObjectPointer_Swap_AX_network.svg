FALSE auf ID_NULL (nichts sichtbar). ISO 11783-6 F.22 'Change Numeric Value'
(Q_NumericValue) - ObjectPointer liegt explizit in dessen gueltigem
Object-ID-Bereich (27000-27999). NICHT F.38 'Change Attribute' (Q_Attribute)
verwenden - AID_OP_PTR.VALUE ist dort read-only. Muster:
ms-train/4diac_training1
Ventilsteuerung/4diacIDE-workspace/test_B/Uebungen/Uebung_015.SUB (Franz).</text>
