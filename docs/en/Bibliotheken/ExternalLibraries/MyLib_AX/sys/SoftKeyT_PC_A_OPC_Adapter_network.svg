  <text x="-263.1" y="-127.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">Geraet A (Station 11, 192.168.1.11): wie Softkey_Toggle_RPC_TO_Remote_BG_OPC,
aber HMI (SoftKey + GreenWhiteBackground) und OPC-UA-Trigger sind getrennt -
SoftKeyT_AE_AX buendelt die HMI hinter einem AE_AX-Plug,
AE_AX_CLIENT_0_SUBSCRIBE_1 buendelt CLIENT_0 + AX_SUBSCRIBE_1 hinter einem
