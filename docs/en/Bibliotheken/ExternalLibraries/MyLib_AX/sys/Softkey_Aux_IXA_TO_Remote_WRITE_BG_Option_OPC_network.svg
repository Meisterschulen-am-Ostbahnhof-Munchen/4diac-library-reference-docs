  <text x="-118.8" y="-127.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">VT-SoftKey lesen ODER AUX-Zuweisung (Joystick) lesen ODER lokaler Web-Override
(z.B. vt-ui-mirror auf demselben Modul) + Remote-OPC-UA-Write an Zielmodul +
VT-Hintergrundfarbe (SoftKey UND AUX) aus Remote-Subscribe - Option-Lib-
Variante von Softkey_Aux_IXA_TO_Remote_WRITE_BG_OPC: Kommando-Seite komplett
inaktiv (echtes INIT_REQ/INIT_CNF, kein VT-Object-Binding) wenn die Option
nicht ausgewaehlt ist. Status-Seite (Remote-Subscribe) bleibt unveraendert
immer aktiv - reiner Read ohne Seiteneffekt.</text>
