Consumer weiterreichen (z.B. AR_CALIBRATE_SQ_REF.Y_Offset/.Y_Scale, oder direkt
an ein INI_AR2). Speichert NICHT selbst - der Consumer persistiert (z.B. via
ZERO/SPAN+INI_AR2), das Echo kommt hier ueber denselben AR2-Plug zurueck und
wird auf das VT-Feld zurueckgeschrieben (auch beim Boot)</text>
