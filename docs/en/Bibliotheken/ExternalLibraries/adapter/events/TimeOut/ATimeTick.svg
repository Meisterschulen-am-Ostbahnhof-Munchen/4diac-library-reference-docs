    <polygon points="1.5,111.0 6.5,116.0 1.5,121.0" fill="#A3B08F"/>
    <text x="9.5" y="117.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">Q</text>

    <polygon points="1.5,131.0 6.5,136.0 1.5,141.0" fill="#3366FF"/>
    <text x="9.5" y="137.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
