<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 594.875 192.0"
     width="594.875" height="192.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(221.6875, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 128.25 0
            A 3 3 0 0 1 131.25 3
            L 131.25 63.0
            A 3 3 0 0 1 128.25 66.0
            L 121.25 66.0
            L 121.25 106.0
            L 128.25 106.0
            A 3 3 0 0 1 131.25 109.0
            L 131.25 169.0
            A 3 3 0 0 1 128.25 172.0
            L 3 172.0
            A 3 3 0 0 1 0 169.0
            L 0 109.0
            A 3 3 0 0 1 3 106.0
            L 10 106.0
            L 10 66.0
            L 3 66.0
            A 3 3 0 0 1 0 63.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
          fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1.5"
          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="1.5,11.0 6.5,16.0 1.5,21.0" fill="#63B31F"/>
    <text x="9.5" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">CNF</text>

    <polygon points="1.5,31.0 6.5,36.0 1.5,41.0" fill="#63B31F"/>
    <text x="9.5" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">STARTO_IN</text>

    <polygon points="1.5,51.0 6.5,56.0 1.5,61.0" fill="#63B31F"/>
    <text x="9.5" y="57.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle">STOPO_IN</text>

    <polygon points="124.75,11.0 129.75,16.0 124.75,21.0" fill="#63B31F"/>
    <text x="121.75" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">REQ</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 24.09375 77.0
            L 40.09375 77.0
            A 1 1 0 0 1 41.09375 78.0
            L 41.09375 81.5
            L 39.09375 81.5
            L 39.09375 84.5
            L 41.09375 84.5
            L 41.09375 94.0
            A 1 1 0 0 1 40.09375 95.0
            L 24.09375 95.0
            A 1 1 0 0 1 23.09375 94.0
            L 23.09375 84.5
            L 25.09375 84.5
            L 25.09375 81.5
            L 23.09375 81.5
            L 23.09375 78.0
            A 1 1 0 0 1 24.09375 77.0
            Z"
