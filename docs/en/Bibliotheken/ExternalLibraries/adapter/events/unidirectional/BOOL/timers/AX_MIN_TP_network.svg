  <text x="4.7" y="-127.3" font-family="'TGL 0-17_std', 'TGL 0-17', 'Times New Roman', Times, serif" font-size="12" font-weight="bold" fill="#333333">Minimum-Pulsbreite: AX_Q folgt AX_IN, ist aber mindestens PT lang - kuerzere
Pulse werden auf PT gestreckt, laengere Pulse unveraendert durchgereicht
(Gegenstueck zu AX_TP, das immer exakt PT macht, und AX_TLIM, das auf maximal PT
kappt). Franz: Bunkerboden-Vorlauf im Automatikbetrieb braucht eine Mindestzeit.
Sicherheitshinweis (Martin Schuder): dieser Baustein selbst hat KEINEN
Hard-Abbruch - ein Endschalter, der den Puls jederzeit sofort unterbrechen soll,
muss extern per AX_AND(AX_Q, NOT Endschalter) NACH diesem Baustein verknuepft
werden, nicht ueber diesen Baustein selbst.</text>
