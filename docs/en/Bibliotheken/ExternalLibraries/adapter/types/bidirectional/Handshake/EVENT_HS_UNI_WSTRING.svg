<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 688.4375 112.0"
     width="688.4375" height="112.0">
  <style>
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-17_std"), local("TGL 0-17"), local("TGL 0-17 alt");
      font-style: normal;
      font-weight: normal;
    }
    @font-face {
      font-family: "TGL";
      src: local("TGL 0-16_std"), local("TGL 0-16");
      font-style: italic;
      font-weight: normal;
    }
  </style>
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(35, 10)">

    <!-- Block Outline -->
    <path d="M 3 0
            L 209.4375 0
            A 3 3 0 0 1 212.4375 3
            L 212.4375 23.0
            A 3 3 0 0 1 209.4375 26.0
            L 202.4375 26.0
            L 202.4375 66.0
            L 209.4375 66.0
            A 3 3 0 0 1 212.4375 69.0
            L 212.4375 89.0
            A 3 3 0 0 1 209.4375 92.0
            L 3 92.0
            A 3 3 0 0 1 0 89.0
            L 0 69.0
            A 3 3 0 0 1 3 66.0
            L 10 66.0
            L 10 26.0
            L 3 26.0
            A 3 3 0 0 1 0 23.0
            L 0 3
            A 3 3 0 0 1 3 0
            Z"
          fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1.5"
          stroke-linejoin="round" filter="url(#dropShadow)"/>

    <!-- Event Ports -->

    <polygon points="205.9375,11.0 210.9375,16.0 205.9375,21.0" fill="#63B31F"/>
    <text x="202.9375" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">REQ</text>

    <!-- Name Section -->
    <!-- FB Type Icon -->
    <path d="M 21.0 37.0
            L 37.0 37.0
            A 1 1 0 0 1 38.0 38.0
            L 38.0 41.5
            L 36.0 41.5
            L 36.0 44.5
            L 38.0 44.5
            L 38.0 54.0
            A 1 1 0 0 1 37.0 55.0
            L 21.0 55.0
            A 1 1 0 0 1 20.0 54.0
            L 20.0 44.5
            L 22.0 44.5
            L 22.0 41.5
            L 20.0 41.5
            L 20.0 38.0
            A 1 1 0 0 1 21.0 37.0
            Z"
          fill="#87CEEB" stroke="#1565C0" stroke-width="1"/>
    <text x="29.0" y="51.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12" font-weight="bold"
          fill="#000000" text-anchor="middle">S</text>

    <!-- Block Name -->
    <text x="43.0" y="51.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" font-style="italic">EVENT_HS_UNI_WSTRING</text>
    
    <text x="106.21875" y="66.0"
          font-family="TGL, 'Times New Roman', Times, serif" font-size="12"
          fill="#666666" text-anchor="middle">1.0</text>

    <!-- Data Ports -->

    <polygon points="205.9375,71.0 210.9375,76.0 205.9375,81.0" fill="#BD8663"/>
    <text x="202.9375" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" text-anchor="end" dominant-baseline="middle">REQD</text>


    <!-- Event-Data Association Connectors and Lines -->

    <rect x="217.4375" y="11.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <rect x="217.4375" y="71.0" width="10" height="10"
          fill="#FFFFFF" stroke="#000000" stroke-width="1"/>

    <line x1="222.4375" y1="16.0" x2="222.4375" y2="76.0"
          stroke="#000000" stroke-width="1"/>

    <!-- Horizontal Connection Lines -->

    <line x1="212.4375" y1="16.0" x2="232.4375" y2="16.0"
          stroke="#000000" stroke-width="1"/>

    <line x1="212.4375" y1="76.0" x2="232.4375" y2="76.0"
          stroke="#000000" stroke-width="1"/>

    <!-- External Labels -->

    <text x="237.4375" y="17.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Request/notification from Plug to Socket, no reply expected</text>

    <text x="237.4375" y="77.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">WSTRING</tspan> – Request payload, accompanies REQ</text>
  </g>
</svg>