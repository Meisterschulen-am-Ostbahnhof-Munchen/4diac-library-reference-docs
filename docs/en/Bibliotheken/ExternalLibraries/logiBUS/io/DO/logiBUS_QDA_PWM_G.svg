    <text x="240.0" y="37.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
          fill="#000000" dominant-baseline="middle"><tspan font-family="TGL, 'Times New Roman', Times, serif" font-style="italic" dominant-baseline="middle">Event</tspan> – Confirmation of Requested Service</text>

    <text x="240.0" y="57.0" font-family="TGL, 'Times New Roman', Times, serif" font-size="14"
